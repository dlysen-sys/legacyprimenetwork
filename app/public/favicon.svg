<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LegacyPrime">
  <defs>
    <linearGradient id="lpBadge" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="lpGold" x1="18" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#F6C445"/>
      <stop offset="1" stop-color="#DF9C08"/>
    </linearGradient>
  </defs>
  <!-- rounded-square badge (self-contained: legible on light or dark backgrounds) -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#lpBadge)"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- LP monogram — built from geometric strokes (L = angle, P = stem + bowl), gold -->
  <g stroke="url(#lpGold)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 16V48H38"/>
    <path d="M33 48V16a9 7.5 0 0 1 0 15"/>
  </g>
